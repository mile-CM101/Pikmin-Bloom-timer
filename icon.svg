<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8FD14F"/>
      <stop offset="100%" stop-color="#4E8A1D"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E86C"/>
      <stop offset="100%" stop-color="#5CA325"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE45E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Stem -->
  <path d="M256 420 C256 340 245 270 256 210" stroke="#3B6E14" stroke-width="24" stroke-linecap="round" fill="none"/>
  <!-- Side Leaf -->
  <path d="M258 330 C310 310 350 330 365 290 C335 270 290 285 258 315 Z" fill="url(#leaf)" stroke="#3B6E14" stroke-width="6"/>

  <!-- 5 White/Pink Petals -->
  <g transform="translate(256, 185)">
    <circle cx="0" cy="-78" r="48" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="6"/>
    <circle cx="74" cy="-24" r="48" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="6"/>
    <circle cx="46" cy="63" r="48" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="6"/>
    <circle cx="-46" cy="63" r="48" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="6"/>
    <circle cx="-74" cy="-24" r="48" fill="#FFFFFF" stroke="#FFD1DC" stroke-width="6"/>
    <!-- Flower Center -->
    <circle cx="0" cy="0" r="42" fill="url(#center)" stroke="#D97706" stroke-width="6"/>
    <!-- Cute Shine -->
    <ellipse cx="-14" cy="-14" rx="10" ry="7" transform="rotate(-30 -14 -14)" fill="#FFFBEB" opacity="0.8"/>
  </g>

  <!-- Coin Badge -->
  <g transform="translate(380, 385)">
    <circle cx="0" cy="0" r="68" fill="#FBBF24" stroke="#FFF" stroke-width="10"/>
    <circle cx="0" cy="0" r="50" fill="#F59E0B"/>
    <text x="0" y="18" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFBEB" text-anchor="middle">P</text>
  </g>
</svg>
